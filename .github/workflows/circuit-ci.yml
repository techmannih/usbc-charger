name: Circuit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circuit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TSCI_SKIP_CLI_UPDATE: "true"
  TSCI_TELEMETRY_DISABLED: "true"
  FORCE_COLOR: "0"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck circuit source
        run: bun run typecheck

  netlist:
    name: Netlist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check circuit connections
        run: bun run check:netlist

  build:
    name: Build
    needs: [typecheck, netlist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check committed fabrication package integrity
        run: bun run check:fabrication
      - name: Build routed circuit
        run: bun run build:routed
      - name: Check fresh routed circuit for copper shorts
        run: bun node_modules/tscircuit/cli.mjs check shorts dist/index/circuit.json
      - name: Retain build output and any short-check diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circuit-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/index/
            checks/check-shorts/
          if-no-files-found: warn
          retention-days: 7
